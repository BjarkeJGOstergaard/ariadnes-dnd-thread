[project]
name = "ariadnes-dnd-thread"
version = "0.1.0"
description = "Backend API for Ariadnes Dnd Thread (Campaign Memory)"
authors = [
    { name = "Bjarke Østergaard", email = "Bjarke.J.G.Oestergaard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ariadnes-dnd-thread = "ariadnes_dnd_thread:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
